
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#111827">
  <title>STRIKE FLOW</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="app">
    <header>
      <div class="brand">
        STRIKE <b>FLOW</b>
        <small>すとふろ</small>
      </div>

      <div id="status">READY</div>
      <button id="pause" class="tiny" aria-label="ポーズ">Ⅱ</button>
    </header>

    <div id="game-wrap">
      <canvas
        id="game"
        width="960"
        height="540"
        aria-label="STRIKE FLOW ゲーム画面"
      ></canvas>

      <div id="overlay" class="overlay">
        <div class="panel">
          <h1>STRIKE <em>FLOW</em></h1>
          <p>7人のファイター。自由につながるコンボ。</p>

          <div class="roster-title">
            キャラクターを選択
            <span id="selected-name">レイ（バランス）</span>
          </div>

          <div
            id="roster"
            class="roster"
            role="group"
            aria-label="キャラクター選択"
          ></div>

          <label class="fallback-select">
            キャラクター
            <select id="character"></select>
          </label>

          <label>
            CPU難易度
            <select id="difficulty">
              <option value="easy">初級</option>
              <option value="normal" selected>中級</option>
              <option value="hard">上級</option>
            </select>
          </label>

          <label>
            ステージ
            <select id="stage">
              <option value="0">CITY</option>
              <option value="1">ROOFTOP</option>
              <option value="2">TRAINING</option>
            </select>
          </label>

          <label>
            キャラカラー
            <input id="color" type="color" value="#53b8ff">
          </label>

          <button id="start" class="primary">
            対戦スタート
          </button>

          <p class="help">
            スマホは横向き推奨 /
            PCは下の操作説明を参照
          </p>
        </div>
      </div>

      <div id="touch" aria-label="タッチ操作">
        <div class="touch-left">
          <button data-key="left">◀</button>
          <button data-key="right">▶</button>
          <button data-key="jump">跳</button>
          <button data-key="dash">走</button>
        </div>

        <div class="touch-right">
          <button data-key="guard">防</button>
          <button data-key="dodge">避</button>
          <button data-key="attack">攻</button>
          <button data-key="skill">技</button>
          <button data-key="super1">必1</button>
          <button data-key="super2">必2</button>
          <button data-key="super3">必3</button>
        </div>
      </div>
    </div>

    <div class="instructions">
      PC：A/D 移動・W ジャンプ・J 攻撃・
      K×2 固有技・L ガード・Shift 回避・
      Space ダッシュ・U/I/O 必殺技
      ／ 方向＋攻撃で技を変化
      ／ 被コンボ中に左右を押し直して脱出
    </div>

    <footer id="message">
      準備完了。キャラクターを選んでスタート！
    </footer>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
